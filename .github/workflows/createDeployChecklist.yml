name: Create or update deploy checklist

on:
  workflow_call:
    inputs:
      TAG:
        description: Git tag being deployed to staging
        required: false
        type: string
  workflow_dispatch:
    inputs:
      TAG:
        description: Git tag being deployed to staging
        required: false

jobs:
  createChecklist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # No setupNode/install here: createOrUpdateStagingDeploy is an
      # ncc-bundled action (self-contained index.js), so node_modules is
      # never read and a full install would be wasted time.
      - name: Create or update deploy checklist
        uses: ./.github/actions/javascript/createOrUpdateStagingDeploy
        with:
          GITHUB_TOKEN: ${{ secrets.KIROKU_ADMIN_TOKEN }}
          TAG: ${{ inputs.TAG }}
