// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"

        androidXCore = "1.0.2"
        multiDexEnabled = true
        googlePlayServicesVersion = "17.0.0"
        kotlinVersion = "2.1.20"

        // Present only when settings.gradle included React Native as a source build.
        reactNativeIncludedBuild = gradle.includedBuilds.find { it.name == 'react-native' }

        // Decided in gradleUtils/patchedArtifactsSettings.gradle, applied from settings.gradle.
        patchedArtifacts = gradle.ext.patchedArtifacts
    }
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.google.com' } // For image picker
        maven { url "https://www.jitpack.io" } // For image picker
        maven { url "https://maven.fullstory.com" }
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.2")
        classpath("com.google.firebase:firebase-crashlytics-gradle:3.0.3")
        classpath("com.google.firebase:perf-plugin:2.0.2")

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}


allprojects {
    configurations.all {
        resolutionStrategy {
            force 'org.xerial:sqlite-jdbc:3.34.0'

            eachDependency { dependency ->
                if (dependency.requested.group == 'org.bouncycastle') {
                    println dependency.requested.module
                    dependency.useTarget 'org.bouncycastle:bcprov-jdk15to18:1.71'
                }
            }

            // Point every consumer of React Native (the app and every autolinked library) at our
            // prebuilt, patched artifact instead of the stock one on Maven Central. `hermes-android`
            // is deliberately not substituted: no patch touches Hermes, so the official artifact is
            // the right one. When building from source, settings.gradle substitutes both with
            // projects of the included build instead.
            if (!patchedArtifacts.buildFromSource) {
                def patchedReactAndroid = "${patchedArtifacts.group}:react-android:${patchedArtifacts.version}"
                dependencySubstitution {
                    substitute(module('com.facebook.react:react-native')).using(module(patchedReactAndroid))
                    substitute(module('com.facebook.react:react-android')).using(module(patchedReactAndroid))
                }
                force patchedReactAndroid
            }
        }
    }
    repositories {
        if (!patchedArtifacts.buildFromSource) {
            maven {
                url patchedArtifacts.repositoryUrl
                // Nothing else lives in this repository, and GitHub Packages is slow to say 404.
                content { includeGroup patchedArtifacts.group }
                if (patchedArtifacts.username && patchedArtifacts.password) {
                    credentials {
                        username = patchedArtifacts.username
                        password = patchedArtifacts.password
                    }
                }
            }
        }
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url("$rootDir/../node_modules/react-native/android")
        }
    }
}

apply plugin: "com.facebook.react.rootproject"

// Entry points used by .github/workflows/publishReactNativeAndroidArtifacts.yml to build and
// publish the patched React Native artifacts. They only exist when React Native is part of the
// build as a source build, which the publish workflow forces with
// -PpatchedArtifacts.forceBuildFromSource=true.
tasks.register('buildReactNativeArtifacts') {
    description = 'Builds the patched react-android AAR from source.'
    if (reactNativeIncludedBuild != null) {
        dependsOn(reactNativeIncludedBuild.task(':packages:react-native:ReactAndroid:assemble'))
    }
}

tasks.register('publishReactNativeArtifacts') {
    description = 'Publishes the patched react-android AAR to the configured Maven repository.'
    if (reactNativeIncludedBuild != null) {
        dependsOn(reactNativeIncludedBuild.task(
                ':packages:react-native:ReactAndroid:publishReleasePublicationToPatchedArtifactsRepository'))
    }
}
