# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx512m -XX:MaxMetaspaceSize=256m
# 6g, not 8g: the deploy build runs bundleProductionRelease for 4 ABIs with
# org.gradle.parallel on a 16 GB runner; an 8g daemon heap reservation plus
# concurrent CMake/ninja trees exhausted the VM and killed the runner
# (deploy run 32708297508). Parallel needs the memory more than the daemon does.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true

# Reuse task outputs from earlier builds instead of re-running the tasks.
# https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true

# Increase storage capacity (the default is 6 MB)
AsyncStorage_db_size_in_MB=10
AsyncStorage_useNextStorage=true
AsyncStorage_next_kspVersion=2.1.20-1.0.32

# Use this property to specify which architecture you want to build.
# You can also override it from the CLI using
# ./gradlew <task> -PreactNativeArchitectures=x86_64
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Use this property to enable support to the new architecture.
# This will allow you to use TurboModules and the Fabric render in
# your application.
newArchEnabled=true

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
# Enable hermes for staging/production releases
hermesEnabled=true

# Upload Keystore
MYAPP_UPLOAD_STORE_FILE=kiroku-play-key.keystore

# Key Information
MYAPP_UPLOAD_KEY_ALIAS=kiroku-play-key

# Disable Frame Processors for VisionCamera.
disableFrameProcessors=true

android.nonTransitiveRClass=false

# React Native and Hermes are consumed as prebuilt artifacts, published per patch set by
# .github/workflows/publishReactNativeAndroidArtifacts.yml. Flip this to true to compile React
# Native from source instead, which is what every build used to do and costs 40 to 55 minutes.
patchedArtifacts.forceBuildFromSource=false
patchedArtifacts.group=com.kiroku.react
patchedArtifacts.repositoryUrl=https://maven.pkg.github.com/PetrCala/Kiroku
